<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambulance Detection System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #333;
        }
        #ambulanceCount {
            font-size: 3rem;
            font-weight: bold;
            color: #007bff;
            margin: 1rem 0;
        }
        #detectButton {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        #detectButton:hover {
            background-color: #218838;
        }
        .video-container {
            margin-top: 1rem;
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
        }
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ambulance Detection System</h1>
        <p>Number of Ambulances Detected:</p>
        <div id="ambulanceCount">0</div>
        <button id="detectButton">Detect Ambulance</button>
        <div class="video-container">
            <video id="ambulanceVideo" autoplay loop>
    <source src="{{ vid.video.url }}" type="video/mp4">
    Your browser does not support the video tag.
</video>
        </div>
    </div>

    <script>
        let ambulanceCount = 0;
        const countElement = document.getElementById('ambulanceCount');
        const detectButton = document.getElementById('detectButton');
        const video = document.getElementById('ambulanceVideo');

        // Function to simulate ambulance detection
        function simulateAmbulanceDetection() {
            const randomNumber = Math.random(); // Generate a random number between 0 and 1
            return randomNumber < 0.3; // 30% chance of detecting an ambulance
        }

        // Function to send data to the server (simulation)
        async function sendToServer(count) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    console.log(`Sent to server: ${count} ambulances`);
                    resolve();
                }, 500);
            });
        }

        // Function to detect ambulances
        async function detectAmbulance() {
            const detected = simulateAmbulanceDetection();
            if (detected) {
                ambulanceCount++;
                countElement.textContent = ambulanceCount;

                try {
                    await sendToServer(ambulanceCount);
                } catch (error) {
                    console.error('Error sending data to server:', error);
                }
            }
        }

        // Handle the detect button click
        detectButton.addEventListener('click', () => {
            detectAmbulance();
            if (video.paused) {
                video.play();
            }
        });

        // Automatic detection every 5 seconds while the video is playing
        let detectionInterval;
        video.addEventListener('play', () => {
            detectionInterval = setInterval(() => {
                if (!video.paused && !video.ended) {
                    detectAmbulance();
                }
            }, 3000);
        });

        video.addEventListener('pause', () => {
            clearInterval(detectionInterval);
        });

        video.addEventListener('ended', () => {
            clearInterval(detectionInterval);
        });
    </script>
</body>
</html>
